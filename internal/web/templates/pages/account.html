{{define "content"}}
<h2>账号设置</h2>
<div class="card">
  <dl class="kv">
    <dt>用户名</dt><dd>{{.Data.User.Username}}</dd>
    <dt>角色</dt><dd><span class="role-chip {{.Data.User.Role}}">{{roleName .Data.User.Role}}</span></dd>
    <dt>注册时间</dt><dd>{{timefmt .Data.User.CreatedAt}}</dd>
  </dl>
</div>

<div class="card">
  <h3>修改密码</h3>
  {{with .Data.Error}}<div class="alert bad">{{.}}</div>{{end}}
  <form method="post" action="/account/password">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>当前密码<input type="password" name="current" required autocomplete="current-password"></label>
    <label>新密码<input type="password" name="new" required autocomplete="new-password">
      <span class="help">至少 8 位；修改后将注销其他设备的登录状态</span></label>
    <label>确认新密码<input type="password" name="confirm" required autocomplete="new-password"></label>
    <button class="btn primary" type="submit">修改密码</button>
  </form>
</div>
{{end}}
