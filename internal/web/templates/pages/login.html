{{define "content"}}
<h2>登录</h2>
{{with .Data.Error}}<div class="alert bad">{{.}}</div>{{end}}
<form method="post" action="/login">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>用户名<input name="username" value="{{.Data.Username}}" required autofocus autocomplete="username"></label>
  <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn primary" type="submit" style="width:100%">登录</button>
</form>
<p class="muted small" style="margin-top:1rem">
  {{if eq .Settings.RegistrationMode "closed"}}没有账号？请联系管理员开通。{{else}}没有账号？<a href="/register">注册新账号</a>{{end}}
</p>
{{end}}
