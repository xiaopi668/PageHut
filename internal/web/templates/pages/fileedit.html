{{define "content"}}
<div class="page-head">
  <h2>编辑文件</h2>
  <a class="btn" href="/projects/{{.Data.Project.ID}}/files?dir={{urlquery (parentDirOf .Data.Path)}}">返回文件列表</a>
</div>

<div class="card">
  <p class="mono">{{.Data.Project.Slug}}/{{.Data.Path}}</p>
  {{if .Data.CanManage}}
  <form method="post" action="/projects/{{.Data.Project.ID}}/file/save">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="path" value="{{.Data.Path}}">
    <label>内容<textarea name="content" rows="22" spellcheck="false">{{.Data.Content}}</textarea></label>
    <button class="btn primary" type="submit">保存</button>
  </form>
  {{else}}
  <pre class="mono" style="white-space:pre-wrap;background:rgba(255,255,255,.05);border:1px solid var(--glass-border-soft);border-radius:12px;padding:1rem;max-height:60vh;overflow:auto">{{.Data.Content}}</pre>
  <p class="muted small">只读模式（审核员查看）。</p>
  {{end}}
</div>
{{end}}
