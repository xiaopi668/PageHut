{{define "content"}}
<h2>创建项目</h2>
<div class="card">
  {{with .Data.Error}}<div class="alert bad">{{.}}</div>{{end}}
  <p class="muted small">当前额度：项目数量 {{if ge .Data.CountLimit 100000}}不限{{else}}{{.Data.Used}} / {{.Data.CountLimit}}{{end}}，单个项目最大 {{bytesize .Data.SizeLimit}}。</p>
  <form method="post" action="/projects/new">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>项目名称<input name="name" value="{{.Data.Name}}" required autofocus placeholder="例如：我的个人主页"></label>
    <label>访问路径<input name="slug" value="{{.Data.Slug}}" placeholder="留空则根据名称自动生成">
      <span class="help">只允许小写字母、数字和短横线；最终访问地址为 <code>站点域名/访问路径/</code>（站点域名由管理员配置）</span></label>
    <button class="btn primary" type="submit">创建</button>
    <a class="btn" href="/">取消</a>
  </form>
</div>
{{end}}
