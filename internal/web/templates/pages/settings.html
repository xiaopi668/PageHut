{{define "content"}}
<h2>系统设置</h2>
<form method="post" action="/admin/settings">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <div class="card">
    <h3>基本</h3>
    <label>站点名称<input name="site_name" value="{{.Data.S.SiteName}}" required></label>
    <label>注册模式
      <select name="registration_mode">
        <option value="public" {{if eq .Data.S.RegistrationMode "public"}}selected{{end}}>公开注册（任何人可注册）</option>
        <option value="invite" {{if eq .Data.S.RegistrationMode "invite"}}selected{{end}}>邀请码注册</option>
        <option value="closed" {{if eq .Data.S.RegistrationMode "closed"}}selected{{end}}>关闭注册（仅管理员建号）</option>
      </select>
    </label>
    <label style="display:flex;align-items:center;gap:.5rem;color:var(--text)">
      <input type="checkbox" name="review_enabled" value="1" style="width:auto" {{if .Data.S.ReviewEnabled}}checked{{end}}>
      启用审核（开启时项目需审核通过才能访问；关闭时上传即发布）
    </label>
  </div>

  <div class="card">
    <h3>额度</h3>
    <p class="help">所有数值保存在后台随时可改；免费用户可在「用户管理」中单独覆盖额度。</p>
    <div class="inline-form">
      <label>单个项目大小上限（MB，全站硬上限）<input name="max_project_size_mb" type="number" min="1" value="{{$max := div .Data.S.MaxProjectSize 1048576}}{{$max}}" required></label>
      <label>免费用户项目数量上限<input name="free_project_count" type="number" min="0" value="{{.Data.S.FreeProjectCount}}" required></label>
      <label>免费用户单项目大小上限（MB）<input name="free_project_size_mb" type="number" min="0" value="{{div .Data.S.FreeProjectSize 1048576}}" required></label>
    </div>
  </div>

  <div class="card">
    <h3>域名</h3>
    <label>站点域名<input name="sites_host" value="{{.Data.S.SitesHost}}" placeholder="sites.example.com">
      <span class="help">用户项目将以 <code>站点域名/访问路径/</code> 的形式访问（例如 <code>sites.example.com/demo/</code>）。只需给该域名配一条 A 记录，<b>不需要泛解析，也不需要泛域名证书</b>。留空表示不启用站点域名访问（仍可用预览与自定义域名）。注意不要与面板域名填成同一个。</span></label>
    <label>面板域名<input name="panel_host" value="{{.Data.S.PanelHost}}" placeholder="dash.example.com">
      <span class="help">面板所在域名。留空时只有「IP / localhost」能进面板，其他域名会返回 404；建议填写，且必须与站点域名不同。</span></label>
  </div>

  <button class="btn primary" type="submit">保存设置</button>
</form>
{{end}}
