name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 代码检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 端到端冒烟测试
        run: bash scripts/e2e.sh

      - name: 交叉编译检查（amd64 + arm64）
        run: bash scripts/build.sh
