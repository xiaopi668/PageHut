name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: 代码检查
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race ./...

      - name: 端到端冒烟测试
        run: bash scripts/e2e.sh

      - name: 交叉编译检查（amd64 + arm64）
        run: bash scripts/build.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 与 compose 的错误如果只在打 tag 时暴露就太晚了
      - name: 构建镜像
        run: docker build --build-arg VERSION=ci -t pagehut:ci .
